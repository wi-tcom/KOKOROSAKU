<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SAKU Trainer</title>
<link rel="stylesheet" href="./unified-v1/trainer-ux4.css">
<link rel="stylesheet" href="./unified-v1/help-pane.css">
</head>
<body>
<div class="screen-with-help">
<main id="trainer-root" aria-live="polite">Trainerを読み込み中 / Loading Trainer…</main>
<aside id="trainer-help" class="help-pane" aria-label="ヘルプ"></aside>
</div>
<script type="module" src="./unified-v1/trainer-ux4-ui.mjs"></script>
<script type="module">
/* U4: the shared help tree beside the Trainer. The guide names the section each node explains.
   The stage headings carried a 「同期」 button as well; Owner removed it on 2026-09-23 as a
   duplicate — the pane is already beside the stages, and 「入力欄へ」 still walks back to them.
   The page re-draws its root, so the pane only has to follow the locale. */
import { mountScreenHelp } from "./unified-v1/screen-help.mjs";
const aside = document.getElementById("trainer-help");
const localeOf = () => (document.documentElement.lang || "ja").startsWith("en") || document.getElementById("locale")?.value === "en" ? "en" : "ja";
const help = await mountScreenHelp({ aside, guideUrls: ["../help/trainer-guide.data.json", "../manual/trainer-guide.data.json"], locale: localeOf() });
if (help) {
  window.__saku_trainer_help = help;
  const root = document.getElementById("trainer-root");
  new MutationObserver(() => { help.setLocale(localeOf()); }).observe(root, { childList: true, subtree: true });
  help.fromHash();
  window.addEventListener("hashchange", () => help.fromHash());
}
</script>
</body>
</html>
