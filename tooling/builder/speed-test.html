<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SAKU Speed Test</title>
<link rel="stylesheet" href="./trainer.css">
<link rel="stylesheet" href="./speed-test.css">
<link rel="stylesheet" href="./help-pane.css">
<link rel="icon" href="./favicon.ico">
</head>
<body>
<div class="screen-with-help">
<main id="speed-test-root" aria-live="polite">AI スピードテストを読み込み中 / Loading AI speed test…</main>
<aside id="speed-test-help" class="help-pane" aria-label="ヘルプ"></aside>
</div>
<script type="module" src="./lib/speed-test-ui.mjs"></script>
<script type="module">
import { mountScreenHelp } from "./lib/screen-help.mjs";
const aside = document.getElementById("speed-test-help");
const localeOf = () => document.getElementById("locale")?.value === "en" ? "en" : "ja";
const help = await mountScreenHelp({ aside, guideUrls: ["./manual/platform-guide.data.json", "./manual/platform-guide.data.json"], locale: localeOf() });
if (help) {
  window.__saku_speed_test_help = help;
  const root = document.getElementById("speed-test-root");
  new MutationObserver(() => { help.setLocale(localeOf()); }).observe(root, { childList: true, subtree: true });
  help.show("platform.speed_test"); help.fromHash();
}
</script>
</body>
</html>
