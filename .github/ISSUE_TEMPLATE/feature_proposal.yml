name: Feature proposal
description: Propose a scoped improvement before opening a non-trivial Pull Request.
title: "[Proposal]: "
labels:
  - proposal
body:
  - type: markdown
    attributes:
      value: |
        A proposal is not adoption, Canonical Authority, or implementation authorization.
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Identify affected paths and preserved boundaries.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundary confirmation
      options:
        - label: I will wait for maintainer scope confirmation before a non-trivial Pull Request.
          required: true
        - label: I included no secrets, credentials, personal/customer data, or restricted third-party content.
          required: true
