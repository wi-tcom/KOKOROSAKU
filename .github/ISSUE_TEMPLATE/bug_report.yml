name: Reproducible bug
description: Report a reproducible problem in KOKOROSAKU
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, personal data, customer data, or vulnerability details."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v0.1.0-beta.1"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
