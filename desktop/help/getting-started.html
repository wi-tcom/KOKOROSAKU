る" data-en="Back to Help by purpose">目的別Helpへ戻る</span></a><script>const setLocale=v=>{const l=String(v).toLowerCase().startsWith("en")?"en":"ja";document.documentElement.lang=l;document.querySelectorAll('[data-ja][data-en]').forEach(e=>e.textContent=e.dataset[l]);return l};document.querySelectorAll('[data-locale]').forEach(b=>b.addEventListener('click',()=>setLocale(b.dataset.locale)));window.SAKU_DESKTOP_I18N={setLocale};setLocale('ja');</script></body></html>
