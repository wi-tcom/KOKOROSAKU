[package]
name = "saku-builder-desktop"
version = "0.1.0-beta.12"
description = "Candidate thin desktop host for SAKU Builder and Trainer"
authors = ["WI-T.COM"]
edition = "2024"
rust-version = "1.97.1"
license = "MPL-2.0"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
flate2 = "=1.1.9"
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = [] }

# 2026-10-14 keying F1 (Owner 結果 190 対策 D, 統括 approval): the app reads its own Authenticode signature with
# WinVerifyTrust on the spot. windows-sys 0.61.2 is already in Cargo.lock (through tauri); no new crate or version.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
